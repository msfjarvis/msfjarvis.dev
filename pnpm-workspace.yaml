  - "@shikijs/themes@4.5.0"
  - "@shikijs/types@4.5.0"
  - "@sveltia/cms"
  - astro
  - cookie@2.0.2
  - immutable@5.1.10
  - keep-sorted-node@0.1.0
  - miniflare
  - p-queue@9.3.5
  - pele
  - pnpm@12.18.0
  - terra-draw
  - workerd
  - wrangler
  - zod@4.6.6
