packages:
  - "."
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # keep-sorted start
  - "@astrojs/cloudflare"
  - "@astrojs/compiler-binding"
  - "@astrojs/compiler-binding-android-arm64"
  - "@astrojs/compiler-binding-darwin-arm64"
  - "@astrojs/compiler-binding-darwin-x64"
