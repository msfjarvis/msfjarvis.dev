    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body[data-concept="4"] {
        --rl-bg: #14263c;
        --rl-text: #edf4fa;
        --rl-muted: #aac2d5;
        --rl-control: #31475e;
        --rl-focus: #94c8e6;
        --rl-pad: clamp(16px, 3vw, 40px);
        --rl-edge: 1480px;
        --rl-slide: min(
          80vw,
          var(--rl-edge),
          max(280px, calc((100vh - 310px) * 16 / 9))
        );

        margin: 0;
        background: var(--rl-bg);
        color: var(--rl-text);
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        font-size: 16px;
        line-height: 1.45;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }

      @supports (height: 100svh) {
        body[data-concept="4"] {
          --rl-slide: min(
            80vw,
            var(--rl-edge),
            max(280px, calc((100svh - 310px) * 16 / 9))
          );
        }
      }

      /* ---- shell ---- */

      .rl-shell {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .rl-mast,
      .rl-bar {
        width: 100%;
        max-width: calc(var(--rl-edge) + 2 * var(--rl-pad));
        margin-inline: auto;
      }

      .rl-mast {
        padding: clamp(16px, 2.6vh, 30px) var(--rl-pad) clamp(6px, 1.4vh, 14px);
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: baseline;
        column-gap: 18px;
        row-gap: 6px;
      }

      .rl-mast h1 {
        margin: 0;
        font-size: clamp(1.1rem, 2vw, 1.6rem);
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: -0.004em;
      }

      .rl-mast .rl-date {
        margin: 0;
        font-size: 0.84rem;
        color: var(--rl-muted);
        white-space: nowrap;
      }

      .rl-mast .rl-stand {
        grid-column: 1 / -1;
        margin: 0;
        font-size: 0.84rem;
        color: var(--rl-muted);
      }

      /* ---- strip ---- */

      .rl-main {
        display: grid;
        align-content: center;
        min-height: 0;
      }

      .rl-strip {
        list-style: none;
        margin: 0;
        padding: 10px calc(50% - var(--rl-slide) / 2) 18px;
        display: flex;
        align-items: flex-start;
        gap: clamp(14px, 1.8vw, 34px);
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        overscroll-behavior-x: contain;
        scrollbar-width: thin;
        scrollbar-color: var(--rl-control) transparent;
      }

      .rl-strip::-webkit-scrollbar {
        height: 6px;
      }
      .rl-strip::-webkit-scrollbar-track {
        background: transparent;
      }
      .rl-strip::-webkit-scrollbar-thumb {
        background: var(--rl-control);
        border-radius: 3px;
      }

      .rl-strip:focus-visible {
        outline: 2px solid var(--rl-focus);
        outline-offset: 3px;
      }

      .rl-slide {
        flex: 0 0 auto;
        width: var(--rl-slide);
        scroll-snap-align: center;
      }

      .rl-fig {
        margin: 0;
      }

      .rl-mat {
        display: block;
        box-shadow: 0 0 0 1px rgba(170, 194, 213, 0.16);
        transition: box-shadow 0.2s ease;
      }

      .rl-slide.is-current .rl-mat {
        box-shadow: 0 0 0 1px rgba(170, 194, 213, 0.44);
      }

      .rl-mat img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
      }

      .rl-mat:focus-visible {
        outline: 2px solid var(--rl-focus);
        outline-offset: 3px;
      }

      .rl-cap {
        margin: 13px 0 0;
        display: grid;
        gap: 2px;
        max-width: min(56ch, 100%);
        overflow-wrap: break-word;
        opacity: 0.62;
        transition: opacity 0.22s ease;
      }

      .rl-slide.is-current .rl-cap {
        opacity: 1;
      }

      .rl-sub {
        font-size: 0.95rem;
      }
      .rl-obs {
        font-size: 0.85rem;
        color: var(--rl-muted);
        overflow-wrap: break-word;
      }

      /* ---- controls ---- */

      .rl-bar {
        padding: clamp(10px, 1.8vh, 18px) var(--rl-pad) clamp(16px, 2.6vh, 28px);
        display: grid;
        grid-template-columns: max-content minmax(90px, 1fr) max-content;
        grid-template-areas:
          "controls track count"
          "hint hint hint";
        align-items: center;
        gap: 10px 18px;
      }

      .rl-controls {
        grid-area: controls;
        display: flex;
        gap: 8px;
      }

      .rl-btn {
        font: inherit;
        font-size: 0.92rem;
        padding: 9px 18px;
        background: transparent;
        color: var(--rl-text);
        border: 1px solid var(--rl-control);
        border-radius: 2px;
        cursor: pointer;
        transition: background-color 0.16s ease;
      }

      .rl-btn:hover {
        background: var(--rl-control);
      }
      .rl-btn:focus-visible {
        outline: 2px solid var(--rl-focus);
        outline-offset: 2px;
      }
      .rl-btn:disabled {
        color: var(--rl-muted);
        opacity: 0.5;
        cursor: default;
        background: transparent;
      }

      .rl-track {
        grid-area: track;
        height: 3px;
        border-radius: 2px;
        background: var(--rl-control);
        overflow: hidden;
      }

      .rl-fill {
        display: block;
        height: 100%;
        background: var(--rl-muted);
        transition: width 0.18s ease;
      }

      .rl-count {
        grid-area: count;
        margin: 0;
        font-size: 0.8rem;
        color: var(--rl-muted);
        font-variant-numeric: tabular-nums;
      }

      .rl-hint {
        grid-area: hint;
        margin: 0;
        font-size: 0.78rem;
        color: var(--rl-muted);
      }
      .rl-hint-touch {
        display: none;
      }

      @media (max-width: 640px) {
        body[data-concept="4"] {
          --rl-slide: 88vw;
        }
      }

      @media (max-width: 620px) {
        .rl-mast {
          grid-template-columns: 1fr;
        }
        .rl-bar {
          grid-template-columns: 1fr max-content;
          grid-template-areas:
            "track track"
            "controls count"
            "hint hint";
        }
        .rl-controls {
          width: 100%;
        }
        .rl-btn {
          flex: 1 1 0;
        }
        .rl-hint-key {
          display: none;
        }
        .rl-hint-touch {
          display: inline;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body[data-concept="4"] *,
        body[data-concept="4"] *::before,
        body[data-concept="4"] *::after {
          transition-duration: 0.001ms !important;
          animation-duration: 0.001ms !important;
        }
      }
    </style>

    <script>
      (function () {
        "use strict";

        var strip = document.getElementById("rl-strip");
        if (!strip) {
          return;
        }

        var slides = Array.prototype.slice.call(
          strip.querySelectorAll(".rl-slide"),
        );
        var total = slides.length;
        if (!total) {
          return;
        }

        var prevBtn = document.getElementById("rl-prev");
        var nextBtn = document.getElementById("rl-next");
        var fill = document.getElementById("rl-fill");
        var counter = document.getElementById("rl-count");
        var reduce = window.matchMedia
          ? window.matchMedia("(prefers-reduced-motion: reduce)")
          : null;

        var current = 0;

        function reduced() {
          return !!(reduce && reduce.matches);
        }

        function midOf(el) {
          var box = el.getBoundingClientRect();
          return box.left + box.width / 2;
        }

        function nearestIndex() {
          var mid = midOf(strip);
          var best = 0;
          var bestGap = Infinity;
          for (var i = 0; i < total; i++) {
            var gap = Math.abs(midOf(slides[i]) - mid);
            if (gap < bestGap - 0.5) {
              bestGap = gap;
              best = i;
            }
          }
          return best;
        }

        function paint(index) {
          for (var i = 0; i < total; i++) {
            var on = i === index;
            slides[i].classList.toggle("is-current", on);
            if (on) {
              slides[i].setAttribute("aria-current", "true");
            } else {
              slides[i].removeAttribute("aria-current");
            }
          }
          if (fill) {
            fill.style.width = ((index + 1) / total) * 100 + "%";
          }
          if (counter) {
            counter.textContent = index + 1 + " / " + total;
          }
          if (prevBtn) {
            prevBtn.disabled = index === 0;
          }
          if (nextBtn) {
            nextBtn.disabled = index === total - 1;
          }
        }

        function alignTo(index, smooth) {
          var delta = midOf(slides[index]) - midOf(strip);
          current = index;
          if (Math.abs(delta) > 1) {
            if (typeof strip.scrollBy === "function") {
              strip.scrollBy({
                left: delta,
                behavior: smooth ? "smooth" : "auto",
              });
            } else {
              strip.scrollLeft += delta;
            }
          }
          paint(index);
        }

        function go(index, smooth) {
          alignTo(Math.max(0, Math.min(total - 1, index)), smooth);
        }

        var queued = false;
        strip.addEventListener(
          "scroll",
          function () {
            if (queued) {
              return;
            }
            queued = true;
            window.requestAnimationFrame(function () {
              queued = false;
              current = nearestIndex();
              paint(current);
            });
          },
          { passive: true },
        );

        strip.addEventListener("keydown", function (event) {
          var key = event.key;
          var step = 0;

          if (key === "ArrowRight" || key === "Right" || key === "PageDown") {
            step = 1;
          } else if (
            key === "ArrowLeft" ||
            key === "Left" ||
            key === "PageUp"
          ) {
            step = -1;
          } else if (key === "Home") {
            event.preventDefault();
            go(0, !reduced());
            return;
          } else if (key === "End") {
            event.preventDefault();
            go(total - 1, !reduced());
            return;
          } else {
            return;
          }

          event.preventDefault();
          go(current + step, !reduced());
        });

        if (prevBtn) {
          prevBtn.addEventListener("click", function () {
            go(current - 1, !reduced());
          });
        }
        if (nextBtn) {
          nextBtn.addEventListener("click", function () {
            go(current + 1, !reduced());
          });
        }

        window.addEventListener(
          "resize",
          function () {
            window.requestAnimationFrame(function () {
              alignTo(current, false);
            });
          },
          { passive: true },
        );

        paint(0);
      })();
    </script>
