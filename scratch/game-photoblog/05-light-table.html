    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --base: #e4ebef;
        --base-hi: #f2f7f9;
        --base-lo: #d3dee4;
        --ink: #163048;
        --muted: #607785;
        --surface: #ffffff;
        --focus: #365f89;
        --line: rgba(22, 48, 64, 0.19);
        --line-soft: rgba(22, 48, 64, 0.08);
        --sans:
          "Avenir Next", Avenir, "Segoe UI", system-ui, -apple-system,
          sans-serif;
        --display:
          Optima, "Optima Nova", "Palatino Linotype", Palatino,
          "Times New Roman", serif;
        --pad: clamp(16px, 3.2vw, 44px);
        --gap: clamp(14px, 1.8vw, 30px);
        --sticky-top: clamp(10px, 2vh, 26px);
        --sticky-h: 0px;
      }

      html {
        background: var(--base);
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        background: var(--base);
        color: var(--ink);
        font-family: var(--sans);
        font-size: clamp(15px, 0.35vw + 14px, 16.5px);
        line-height: 1.55;
        letter-spacing: 0.002em;
      }

      /* Diffused light-table glow, fixed so the glass reads as a surface, not a gradient. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(
            115% 78% at 10% -8%,
            var(--base-hi) 0%,
            rgba(242, 247, 249, 0) 62%
          ),
          radial-gradient(
            88% 62% at 92% 104%,
            rgba(211, 222, 228, 0.9) 0%,
            rgba(211, 222, 228, 0) 70%
          );
      }

      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
        border-radius: 2px;
      }

      .lt-sr {
        position: absolute !important;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .lt-skip {
        position: absolute;
        left: -9999px;
        font-size: 0.86rem;
        background: var(--surface);
        color: var(--ink);
        padding: 8px 12px;
        border: 1px solid var(--focus);
        border-radius: 2px;
      }
      .lt-skip:focus {
        left: var(--pad);
        top: 12px;
        z-index: 6;
      }

      /* ---------- masthead ---------- */

      .lt-mast {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 3px 22px;
        padding: clamp(20px, 3.4vh, 38px) var(--pad) clamp(11px, 1.8vh, 17px);
        border-bottom: 1px solid var(--line-soft);
      }

      .lt-mast h1 {
        margin: 0;
        font-family: var(--display);
        font-weight: 500;
        font-size: clamp(1.28rem, 1.02rem + 0.95vw, 1.72rem);
        line-height: 1.16;
        letter-spacing: 0.004em;
        text-wrap: balance;
      }

      .lt-mast .lt-date {
        margin: 0 0 0 auto;
        font-size: 0.8rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
      }

      /* ---------- table ---------- */

      .lt-table {
        display: block;
        padding: clamp(14px, 2.4vh, 26px) var(--pad) clamp(32px, 6vh, 64px);
      }

      @media (min-width: 62rem) {
        .lt-table {
          display: grid;
          grid-template-columns: minmax(0, 72fr) minmax(17rem, 28fr);
          gap: var(--gap);
          align-items: start;
        }
      }

      /* ---------- stage (selected capture) ---------- */

      /* --frame-w keeps the plate, caption and transport on one shared edge, and
     caps the plate width so a short viewport narrows it instead of letterboxing. */
      .lt-stage {
        --frame-w: min(100%, calc(36dvh * 16 / 9 + 26px));
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 10px 0 12px;
        background: var(--base);
        border-bottom: 1px solid var(--line-soft);
      }

      @media (min-width: 62rem) {
        .lt-stage {
          --frame-w: min(100%, calc((100dvh - 15rem) * 16 / 9 + 26px));
          top: var(--sticky-top);
          padding: 0;
          background: transparent;
          border-bottom: 0;
        }
      }

      .lt-figure {
        margin: 0;
        width: var(--frame-w);
      }

      .lt-plate {
        display: block;
        background: var(--surface);
        padding: clamp(5px, 0.7vw, 12px);
        border-radius: 2px;
        box-shadow:
          0 0 0 1px var(--line-soft),
          0 26px 46px -34px rgba(22, 48, 64, 0.62),
          0 0 70px -14px rgba(255, 255, 255, 0.95);
        transition: box-shadow 0.18s ease;
      }

      .lt-plate:hover {
        box-shadow:
          0 0 0 1px var(--line),
          0 30px 52px -32px rgba(22, 48, 64, 0.6),
          0 0 80px -12px rgba(255, 255, 255, 1);
      }

      .lt-image {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        object-fit: contain;
        background: var(--surface);
        transition: opacity 0.18s ease;
      }

      .lt-plate.is-swapping .lt-image {
        opacity: 0.3;
      }

      .lt-readout {
        width: var(--frame-w);
        margin-top: clamp(10px, 1.4vh, 15px);
      }

      .lt-count {
        margin: 0;
        font-size: 0.74rem;
        letter-spacing: 0.13em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .lt-count .lt-of {
        margin: 0 0.38em;
        letter-spacing: 0.05em;
      }

      .lt-cap {
        margin: 3px 0 0;
        font-family: var(--display);
        font-weight: 500;
        font-size: clamp(1rem, 0.9rem + 0.35vw, 1.18rem);
        line-height: 1.25;
      }

      .lt-caption {
        margin: 2px 0 0;
        max-width: 54ch;
        font-size: 0.92rem;
        line-height: 1.5;
        color: var(--muted);
        text-wrap: pretty;
      }

      /* Hold two caption lines on small screens so the sticky stage keeps its height
     and the thumbnails below never shift under a tap. */
      @media (max-width: 61.99rem) {
        .lt-caption {
          min-height: 3em;
        }
      }

      .lt-transport {
        display: flex;
        gap: 8px;
        margin-top: clamp(10px, 1.6vh, 15px);
      }

      .lt-transport button {
        font: inherit;
        font-size: 0.86rem;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 2px;
        padding: 7px 15px;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }
      .lt-transport button:hover:not(:disabled) {
        border-color: var(--focus);
        color: var(--focus);
      }
      .lt-transport button:disabled {
        color: var(--muted);
        background: transparent;
        border-color: var(--line-soft);
        opacity: 0.6;
        cursor: default;
      }

      .lt-note {
        margin: 8px 0 0;
        font-size: 0.84rem;
        color: var(--muted);
      }

      /* ---------- contact sheet ---------- */

      .lt-sheet {
        margin-top: clamp(18px, 3vh, 28px);
        padding: clamp(10px, 1.3vw, 15px);
        border: 1px solid var(--line-soft);
        border-radius: 3px;
        background: linear-gradient(
          180deg,
          var(--base-hi) 0%,
          var(--base) 32%,
          var(--base-lo) 100%
        );
        box-shadow: inset 0 1px 0 var(--surface);
      }

      @media (min-width: 62rem) {
        .lt-sheet {
          margin-top: 0;
        }
      }

      .lt-thumbs {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(7px, 1vw, 11px);
      }

      .lt-thumb {
        position: relative;
        display: block;
        width: 100%;
        padding: 3px;
        font: inherit;
        line-height: 0;
        color: inherit;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 2px;
        cursor: pointer;
        scroll-margin-top: 18px;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      @media (max-width: 61.99rem) {
        .lt-thumb {
          scroll-margin-top: calc(var(--sticky-h) + 18px);
        }
      }

      .lt-thumb img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        object-fit: contain;
        background: var(--surface);
      }

      .lt-num {
        position: absolute;
        top: 6px;
        left: 6px;
        padding: 0 4px;
        font-size: 0.62rem;
        line-height: 1.5;
        letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 0 0 1px rgba(22, 48, 64, 0.12);
        border-radius: 1px;
        transition:
          background-color 0.15s ease,
          color 0.15s ease;
      }

      .lt-thumb:hover {
        border-color: var(--muted);
      }

      .lt-thumb[aria-pressed="true"] {
        border-color: var(--focus);
        box-shadow:
          0 0 0 2px rgba(54, 95, 137, 0.26),
          0 10px 22px -18px rgba(22, 48, 64, 0.7);
      }
      .lt-thumb[aria-pressed="true"] .lt-num {
        background: var(--focus);
        color: #fff;
        box-shadow: none;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.001ms !important;
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>

    <script>
      (function () {
        "use strict";

        var plate = document.getElementById("lt-plate");
        if (!plate) return;

        var plateImage = document.getElementById("lt-image");
        var capTitle = document.getElementById("lt-cap");
        var capText = document.getElementById("lt-caption");
        var indexOut = document.getElementById("lt-index");
        var totalOut = document.getElementById("lt-total");
        var status = document.getElementById("lt-status");
        var prevBtn = document.getElementById("lt-prev");
        var nextBtn = document.getElementById("lt-next");
        var stage = document.querySelector(".lt-stage");
        var grid = document.getElementById("lt-thumbs");
        if (!grid) return;

        var thumbs = Array.prototype.slice.call(
          grid.querySelectorAll(".lt-thumb"),
        );
        var total = thumbs.length;
        if (!total) return;

        var current = 0;
        var seq = 0;
        var reduced = window.matchMedia
          ? window.matchMedia("(prefers-reduced-motion: reduce)")
          : { matches: false };

        function pad(n) {
          return n < 10 ? "0" + n : String(n);
        }

        function shotAt(i) {
          var b = thumbs[i];
          return {
            src: b.getAttribute("data-shot-src"),
            title: b.getAttribute("data-shot-title"),
            caption: b.getAttribute("data-shot-caption"),
          };
        }

        function commit(i, shot) {
          /* The parent viewer reads these attributes at click time, so keep them live. */
          plate.setAttribute("href", shot.src);
          plate.setAttribute("data-photo", shot.src);
          plate.setAttribute("data-title", shot.title);
          plate.setAttribute("data-caption", shot.caption);
          plateImage.setAttribute("src", shot.src);
          plateImage.setAttribute("alt", shot.title);

          capTitle.textContent = shot.title;
          capText.textContent = shot.caption;
          indexOut.textContent = pad(i + 1);
          totalOut.textContent = String(total);

          for (var t = 0; t < total; t++) {
            thumbs[t].setAttribute("aria-pressed", t === i ? "true" : "false");
          }

          status.textContent =
            "Capture " +
            (i + 1) +
            " of " +
            total +
            ". " +
            shot.title +
            ". " +
            shot.caption;
          prevBtn.disabled = i === 0;
          nextBtn.disabled = i === total - 1;
          current = i;
        }

        function show(i, reveal) {
          if (i < 0 || i >= total) return;
          var shot = shotAt(i);
          var token = ++seq;

          var finish = function () {
            if (token !== seq) return;
            commit(i, shot);
            if (!reduced.matches) {
              window.requestAnimationFrame(function () {
                if (token === seq) plate.classList.remove("is-swapping");
              });
            }
            if (reveal) thumbs[i].scrollIntoView({ block: "nearest" });
          };

          if (reduced.matches) {
            finish();
            return;
          }

          plate.classList.add("is-swapping");
          var pre = new Image();
          pre.onload = finish;
          pre.onerror = finish;
          pre.src = shot.src;
        }

        for (var k = 0; k < total; k++) {
          (function (i) {
            thumbs[i].addEventListener("click", function () {
              show(i, false);
            });
          })(k);
        }

        prevBtn.addEventListener("click", function () {
          show(current - 1, true);
        });
        nextBtn.addEventListener("click", function () {
          show(current + 1, true);
        });

        /* Arrow keys move focus through the sheet; Enter or Space makes the selection. */
        function columns() {
          var tracks = window.getComputedStyle(grid).gridTemplateColumns;
          var parts = tracks ? tracks.split(" ").filter(Boolean) : [];
          return parts.length > 1 ? parts.length : 2;
        }

        grid.addEventListener("keydown", function (event) {
          var key = event.key;
          if (
            key !== "ArrowRight" &&
            key !== "ArrowLeft" &&
            key !== "ArrowDown" &&
            key !== "ArrowUp" &&
            key !== "Home" &&
            key !== "End"
          )
            return;

          var from = thumbs.indexOf(document.activeElement);
          if (from < 0) return;

          var step = columns();
          var target = -1;
          if (key === "ArrowRight") target = from + 1;
          else if (key === "ArrowLeft") target = from - 1;
          else if (key === "ArrowDown") target = from + step;
          else if (key === "ArrowUp") target = from - step;
          else if (key === "Home") target = 0;
          else if (key === "End") target = total - 1;

          event.preventDefault();
          if (target < 0 || target >= total) return;
          thumbs[target].focus();
        });

        /* Arrow keys also step the large view while its link has focus. */
        plate.addEventListener("keydown", function (event) {
          if (event.key === "ArrowLeft") {
            event.preventDefault();
            show(current - 1, true);
          } else if (event.key === "ArrowRight") {
            event.preventDefault();
            show(current + 1, true);
          }
        });

        /* Publish the sticky stage height so focused thumbnails are never hidden by it. */
        function measure() {
          if (!stage) return;
          var h = Math.round(stage.getBoundingClientRect().height);
          document.documentElement.style.setProperty("--sticky-h", h + "px");
        }
        measure();
        window.addEventListener("resize", measure);
        window.addEventListener("load", measure);
        if (window.ResizeObserver && stage)
          new ResizeObserver(measure).observe(stage);

        commit(0, shotAt(0));
      })();
    </script>

    <script src="viewer.js" defer></script>
